capture:
  # Example values. Keep these in sync with KrakenSDR Suite V2.
  # KrakenSDR Suite V2 currently streams at 2.4 MS/s.
  fs: 2400000
  fc: 204640000
  device:
    type: "Kraken"
    # Standard KrakenSDR Suite V2 Heimdall data interface.
    heimdall:
      host: "127.0.0.1"
      port: 8091
    # Must match the number of channels streamed by the Suite.
    channel_count: 5
    reference_channel: 0
    # Channels that produce independent surveillance maps. In array-eigenbeam
    # mode these may overlap with the reference-synthesis channels below.
    surveillance_channels: [0, 1, 2, 3, 4]
  replay:
    state: false
    loop: true
    file: '/opt/blah2/replay/file.kraken'

process:
  performance:
    # 0 chooses a CPU-aware automatic value. Set to 1 to minimize peak CPU,
    # or up to the surveillance-channel count on a workstation.
    surveillance_workers: 0
    # Keep this at 1 when surveillance paths run concurrently.
    fft_threads: 1
  data:
    cpi: 0.5
    buffer: 2.0
    overlap: 0
  ambiguity:
    delayMin: -10
    delayMax: 400
    dopplerMin: -200
    dopplerMax: 200
  clutter:
    enable: true
    delayMin: -10
    delayMax: 400
  reference_synthesis:
    mode: "array_eigenbeam"
    # Optional; all capture channels are used when omitted.
    channels: [0, 1, 2, 3, 4]
    analysis_samples: 32768
    analysis_interval: 10
    power_iterations: 12
    covariance_smoothing: 0.8
    diagonal_loading: 0.001
  detection:
    enable: true
    pfa: 0.00001
    nGuard: 2
    nTrain: 6
    minDelay: 5
    minDoppler: 15
    nCentroid: 6
  tracker:
    enable: true
    initiate:
      M: 3
      N: 5
      maxAcc: 10
    delete: 10
    smooth: "none"

network:
  ip: 0.0.0.0
  ports:
    api: 3000
    map: 3001
    detection: 3002
    track: 3003
    timestamp: 4000
    timing: 4001
    iqdata: 4002
    config: 4003

truth:
  adsb:
    enabled: false
    tar1090: 'adsb.30hours.dev'
    adsb2dd: 'adsb2dd.30hours.dev'
  ais:
    enabled: false
    ip: 0.0.0.0
    port: 30001

location:
  rx:
    latitude: -34.9286
    longitude: 138.5999
    altitude: 50
    name: "Adelaide"
  tx:
    latitude: -34.9810
    longitude: 138.7081
    altitude: 750
    name: "Mount Lofty"

save:
  iq: false
  map: false
  detection: false
  timing: false
  path: "/blah2/save/"
